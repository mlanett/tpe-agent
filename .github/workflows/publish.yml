name: Publish to Maven Central and GitHub Releases

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v0.0.3

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # For creating GitHub releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and publish to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          # Debug: Check if secrets are set (without exposing values)
          echo "Checking secrets..."
          if [ -z "$SIGNING_KEY" ]; then
            echo "ERROR: SIGNING_KEY is not set"
            exit 1
          fi
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "ERROR: SIGNING_PASSWORD is not set"
            exit 1
          fi
          echo "SIGNING_KEY length: ${#SIGNING_KEY}"
          echo "SIGNING_KEY starts with: ${SIGNING_KEY:0:50}..."
          echo "SIGNING_PASSWORD is set: $([ -n "$SIGNING_PASSWORD" ] && echo "yes" || echo "no")"
          
          ./gradlew publish -Pversion=${{ steps.get_version.outputs.VERSION }} --no-daemon --stacktrace

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            monitoring-agent/build/libs/monitoring-agent-${{ steps.get_version.outputs.VERSION }}.jar
            monitoring-agent/build/libs/monitoring-agent-${{ steps.get_version.outputs.VERSION }}-sources.jar
            monitoring-agent/build/libs/monitoring-agent-${{ steps.get_version.outputs.VERSION }}-javadoc.jar
            monitoring-agent/build/libs/monitoring-agent-${{ steps.get_version.outputs.VERSION }}-agent.jar
          generate_release_notes: true
          draft: false
          prerelease: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
